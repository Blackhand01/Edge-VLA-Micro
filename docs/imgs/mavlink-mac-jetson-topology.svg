<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" role="img" aria-labelledby="title desc">
  <title id="title">PX4 MAVLink routing from Mac to Jetson</title>
  <desc id="desc">PX4 SITL on Mac sends MAVLink UDP from 192.168.55.100:14580 to Jetson 192.168.55.1:14540.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f2937"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #fff; stroke: #334155; stroke-width: 2; rx: 10; }
      .mac { fill: #e0f2fe; }
      .jetson { fill: #dcfce7; }
      .ok { fill: #ecfccb; stroke: #4d7c0f; }
      .title { font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .text { font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .mono { font: 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1180" height="360"/>
  <text class="title" x="40" y="42">Validated MAVLink route</text>

  <rect class="box mac" x="50" y="90" width="320" height="145"/>
  <text class="label" x="80" y="125">MacBook PX4 SITL</text>
  <text class="text" x="80" y="155">PX4 + jMAVSim</text>
  <text class="mono" x="80" y="185">192.168.55.100:14580</text>
  <text class="mono" x="80" y="212">mavlink start ... -o 14540 -t 192.168.55.1</text>

  <rect class="box jetson" x="810" y="90" width="320" height="145"/>
  <text class="label" x="840" y="125">Jetson Orin Nano</text>
  <text class="text" x="840" y="155">MAVSDK / UDP listener</text>
  <text class="mono" x="840" y="185">192.168.55.1:14540</text>
  <text class="mono" x="840" y="212">udpin://0.0.0.0:14540</text>

  <path class="arrow" d="M370,162 C500,162 680,162 810,162"/>
  <text class="mono" x="470" y="145">UDP MAVLink heartbeat + telemetry</text>

  <rect class="box ok" x="390" y="260" width="400" height="60"/>
  <text class="label" x="420" y="292">Verified</text>
  <text class="mono" x="510" y="292">got bytes from 192.168.55.100:14580</text>
</svg>
